openapi: 3.0.3
info:
  title: hnmd API — KindleHome (file-based)
  version: 1.0.0
  description: |
    Contrato para el plugin KindleHome (KOReader en Kindle, e-ink).

    - `GET /top` devuelve SOLO metadatos; no incluye el cuerpo markdown.
    - `GET /articles/{itemId}.md` devuelve el artículo como archivo Markdown.
    - El HTML NO se sirve desde aquí: el cliente lo deriva en el dispositivo
      con el conversor MD→HTML propio de KOReader (luamd) y lo abre en el
      lector nativo (crengine).

    Política del cliente (el servidor no puede cambiarla):
    - Descarga on-demand al abrir un ítem; nunca descarga masiva en el refresco.
    - Re-descarga SOLO si el archivo local falta, está vacío o no se puede abrir.
      No se envían cabeceras condicionales (`If-None-Match`, `If-Modified-Since`).
      `ETag`/`Last-Modified` son informativos y se ignoran.
    - Un `404` NO implica borrar la copia local ya descargada.
    - Límites: índice ≤ 128 KiB, artículo ≤ 512 KiB. Respuestas mayores se
      descartan como `too_large`.

    Convenciones: UTF-8, fin de línea `\n`, `id` estable y reutilizable solo
    para el MISMO contenido (el cliente mapea `id` → nombre de archivo local).
servers:
  - url: https://hnmd.miguehm.com/v1
    description: Producción (el plugin usa `hnmd_base_url` = esta URL, con /v1)

security:
  - bearerAuth: []

tags:
  - name: index
    description: Índice de metadatos
  - name: content
    description: Descarga de contenido Markdown

paths:
  /top:
    get:
      tags: [index]
      operationId: getTopIndex
      summary: Índice de los ítems top (solo metadatos)
      description: |
        Devuelve como máximo `limit` ítems, ordenados por `rank` ascendente.
        No hay paginación: si hay más ítems que `limit`, se recorta la cola y
        `truncated` es `true`. El cliente pide `Accept: application/json`.
        Mantener esta respuesta pequeña (≤ 128 KiB): sin cuerpos, sin comentarios.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
          description: Máximo de ítems a devolver (cola recortada por `rank`).
      responses:
        '200':
          description: Índice obtenido
          headers:
            ETag:
              description: Informativo; el cliente no lo usa para revalidar.
              schema: { type: string }
            Cache-Control:
              description: Informativo.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnIndexResponse'
              examples:
                ok:
                  value:
                    schema_version: 1
                    generated_at: '2026-11-16T12:00:00Z'
                    next_refresh_at: '2026-11-16T12:30:00Z'
                    refresh_interval_seconds: 1800
                    returned_count: 2
                    truncated: false
                    items:
                      - id: '42123456'
                        rank: 1
                        type: story
                        title: 'A title about something'
                        hn_url: 'https://news.ycombinator.com/item?id=42123456'
                        url: 'https://example.com/post'
                        by: 'alice'
                        score: 231
                        descendants: 87
                        published_at: '2026-11-16T10:12:00Z'
                        domain: 'example.com'
                        content_status: ok
                        content_error: null
                        content_url: '/v1/articles/42123456.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: '42123456-a-title-about-something.md'
                        content_length: 18432
                        updated_at: '2026-11-16T11:58:00Z'
                      - id: '42120001'
                        rank: 2
                        type: ask
                        title: 'Ask HN: How do you do X?'
                        hn_url: 'https://news.ycombinator.com/item?id=42120001'
                        url: null
                        by: 'bob'
                        score: 45
                        descendants: 30
                        published_at: '2026-11-16T09:30:00Z'
                        domain: null
                        content_status: ok
                        content_error: null
                        content_url: '/v1/articles/42120001.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: '42120001-ask-hn-how-do-you-do-x.md'
                        content_length: 9210
                        updated_at: '2026-11-16T11:58:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/WarmingUp'
        default:
          $ref: '#/components/responses/Error'

  /articles/{itemId}.md:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [content]
      operationId: downloadArticleMarkdown
      summary: Descarga el artículo como archivo Markdown
      description: |
        Devuelve el cuerpo del artículo. El cliente pide `Accept: text/markdown`
        y guarda la respuesta en un `.tmp`, validándola con `Content-Length`
        antes de renombrarla atómicamente a su nombre canónico local.

        `404` significa "no hay markdown para este id" (no listo, nunca existió
        o fue purgado en el servidor). El cliente NO borra su copia local en ese
        caso; solo muestra el error si no hay archivo local.

        El `filename` de `Content-Disposition` es una pista; el cliente ignora
        esa ruta y usa su propio nombre `<id>-<slug>.md`.

        El cuerpo debe empezar con una cabecera visible en Markdown
        (`# Título`, línea `> autor · puntos · comentarios · fecha`, enlaces).
        No usar frontmatter YAML: el `.md` puede abrirse en crudo en el lector
        y el frontmatter se vería como texto.
      responses:
        '200':
          description: Contenido Markdown
          headers:
            Content-Type:
              description: Debe ser text/markdown con charset utf-8.
              schema:
                type: string
                example: 'text/markdown; charset=utf-8'
            Content-Length:
              description: |
                Tamaño exacto en bytes. El cliente lo usa para validar que la
                descarga no quedó truncada. Debe ser ≤ 512 KiB.
              schema:
                type: integer
            Content-Disposition:
              description: Pista de nombre de archivo (el cliente puede ignorarla).
              schema:
                type: string
                example: 'inline; filename="42123456-a-title-about-something.md"'
            ETag:
              description: Informativo; el cliente no revalida.
              schema: { type: string }
            Last-Modified:
              description: Informativo; el cliente no revalida.
              schema: { type: string }
          content:
            text/markdown:
              schema:
                type: string
                format: binary
              examples:
                article:
                  summary: Cabecera visible + cuerpo
                  value: |
                    # A title about something

                    > alice · 231 points · 87 comments · 2026-11-16
                    > HN: https://news.ycombinator.com/item?id=42123456
                    > URL: https://example.com/post

                    Body in Markdown...
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Sin contenido Markdown para este id. El cliente conserva cualquier
            archivo local existente y solo informa si no hay copia local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: No markdown available for this item
                    item_id: '42123456'
        '503':
          $ref: '#/components/responses/WarmingUp'
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [content]
      operationId: headArticleMarkdown
      summary: Consulta disponibilidad y tamaño sin descargar el cuerpo
      description: |
        Opcional para el cliente (optimización). Mismos códigos que GET.
        Debe devolver `Content-Length` y `Content-Type`, sin cuerpo.
      responses:
        '200':
          description: Disponible
          headers:
            Content-Length:
              schema: { type: integer }
            Content-Type:
              schema: { type: string, example: 'text/markdown; charset=utf-8' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Sin contenido Markdown para este id
        '503':
          $ref: '#/components/responses/WarmingUp'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <hnmd_api_key> (aplica a /top y /articles/{id}.md)'

  parameters:
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: |
        Identificador estable del ítem, exactamente el `id` del índice. No debe
        reutilizarse para contenido distinto: el cliente lo mapea a un archivo
        local permanente.

  responses:
    Unauthorized:
      description: API key ausente o inválida
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: unauthorized
                message: Invalid or missing API key
    WarmingUp:
      description: Servicio arrancando o temporalmente no disponible
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar (el cliente lo usa en el mensaje).
          schema: { type: integer, example: 300 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            warming_up:
              value:
                error: warming_up
                message: Server is warming up, try again later
                retry_after_seconds: 300
    Error:
      description: Error genérico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HnIndexResponse:
      type: object
      required: [schema_version, generated_at, returned_count, truncated, items]
      properties:
        schema_version:
          type: integer
          example: 1
          description: Versión del contrato; el cliente rechaza versiones que no conoce.
        generated_at:
          type: string
          format: date-time
        next_refresh_at:
          type: string
          format: date-time
          nullable: true
        refresh_interval_seconds:
          type: integer
          nullable: true
        returned_count:
          type: integer
          description: Número de ítems en `items` (no el total disponible).
          example: 20
        truncated:
          type: boolean
          description: true si había más ítems que `limit` y se recortó la cola.
        items:
          type: array
          items:
            $ref: '#/components/schemas/HnIndexItem'

    HnIndexItem:
      type: object
      required: [id, rank, title, hn_url, content_status]
      properties:
        id:
          type: string
          description: Identificador estable (mismo valor que `{itemId}`).
          example: '42123456'
        rank:
          type: integer
          minimum: 1
        type:
          type: string
          example: story
          description: 'Tipo HN (story, ask, job, poll, ...). No es un enum cerrado.'
        title:
          type: string
        hn_url:
          type: string
          format: uri
        url:
          type: string
          format: uri
          nullable: true
          description: URL externa; null en Ask HN / posts de texto.
        by:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
        descendants:
          type: integer
          nullable: true
          description: Número de comentarios.
        published_at:
          type: string
          format: date-time
          nullable: true
        domain:
          type: string
          nullable: true
        content_status:
          type: string
          enum: [ok, no_content, warming_up, error]
          description: |
            Única fuente de verdad sobre la descarga:
            - ok: GET /articles/{id}.md puede devolver 200 → descargar si falta local.
            - no_content: no habrá markdown → el cliente no intenta descargar.
            - warming_up: aún no listo → el cliente no intenta descargar ahora.
            - error: fallo de generación/captura → el cliente no intenta descargar.
        content_error:
          type: string
          nullable: true
          description: Motivo corto cuando content_status != ok (para el log/UX).
        content_url:
          type: string
          nullable: true
          description: |
            Ruta relativa a `servers[0].url` (ej. `/v1/articles/42123456.md`).
            El cliente rechaza URLs absolutas, otros hosts y esquemas != https.
        content_type:
          type: string
          nullable: true
          example: 'text/markdown; charset=utf-8'
        suggested_filename:
          type: string
          nullable: true
          example: '42123456-a-title-about-something.md'
        content_length:
          type: integer
          nullable: true
          description: Tamaño exacto en bytes si se conoce; permite descartar > 512 KiB sin descargar.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Informativo; el cliente no invalida archivos locales.

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [unauthorized, warming_up, not_found, internal_error]
        message:
          type: string
          description: Mensaje corto y accionable (se muestra en la UI del plugin).
        item_id:
          type: string
          nullable: true
        retry_after_seconds:
          type: integer
          nullable: true
