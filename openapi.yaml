openapi: 3.0.3
info:
  title: hnmd API — KindleHome (file-based)
  version: 1.7.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Contrato para el plugin KindleHome (KOReader en Kindle, e-ink).

    - `GET /top` devuelve SOLO metadatos; no incluye el cuerpo markdown.
    - `GET /articles/{itemId}.md` devuelve el artículo como archivo Markdown.
    - El HTML NO se sirve desde aquí: el cliente lo deriva en el dispositivo
      con el conversor MD→HTML propio de KOReader (luamd) y lo abre en el
      lector nativo (crengine).

    Política recomendada para clientes 1.5:
    - Descarga on-demand al abrir un ítem; nunca descarga masiva en el refresco.
    - Puede revalidar `/top`, `/articles/{itemId}.md`, `/todos` y
      `/todos/tags` con `If-None-Match`. Un `304 Not Modified` conserva la
      copia local y no descarga el cuerpo.
    - Los `ETag` son débiles (`W/"..."`); `Last-Modified` es informativo y en
      los índices de tareas corresponde a la última modificación del store.
    - Se acepta `Accept-Encoding: gzip`; la respuesta comprimida conserva el
      mismo `ETag` débil y añade `Vary: Accept-Encoding`. Los cuerpos de menos
      de 256 bytes se envían sin comprimir.
    - `/top` acepta también `HEAD` (mismas cabeceras que `GET`, sin cuerpo).
    - CORS: el allowlist se configura con `CORS_ORIGINS` (por defecto `web`,
      `http://localhost:5173`, `https://localhost` y `capacitor://localhost`).
      Las peticiones `OPTIONS` responden `204` sin autenticación. Se permiten
      `Authorization`, `Content-Type`, `If-Match`, `If-None-Match` y
      `X-Request-ID`; se exponen `ETag`, `Retry-After`, `Location` y
      `X-Request-ID`. Las respuestas CORS añaden `Vary: Origin`.
    - Toda respuesta incluye `X-Request-ID`. Si el cliente envía uno válido
      (`[A-Za-z0-9._-]{1,64}`) se reutiliza; si no, el servidor genera uno. Sirve
      para correlacionar con los logs del servidor.
    - Un `404` NO implica borrar la copia local ya descargada.
    - Límites: índice ≤ 128 KiB, artículo ≤ 512 KiB. Respuestas mayores se
      descartan como `too_large`.

    Paginación: `/top`, `/todos` y `/todos/tags` aceptan `offset` y `limit` y
    devuelven `offset`, `limit`, `returned_count`, `truncated`, `has_more` y
    `next_offset`. `truncated` indica recorte por tamaño o por la cola; para
    avanzar usa `next_offset` mientras `has_more` sea true.

    Condicionales de escritura: `PATCH` y `DELETE` sobre tareas exigen
    `If-Match` con la revisión actual (`"2"` o `W/"2"`) o `*`. Sin cabecera se
    devuelve `428 precondition_required`; con revisión obsoleta,
    `412 revision_conflict` y `current_revision`.

    Convenciones: UTF-8, fin de línea `\n`, `id` estable y reutilizable solo
    para el MISMO contenido (el cliente mapea `id` → nombre de archivo local).

    Módulo de tareas (`/todos`):
    - Multitag plano: hasta 10 tags por tarea; el primero es el primario.
    - `details` es una nota opcional (≤1000 bytes) que se renderiza indentada
      bajo la tarea en el Markdown; los clientes antiguos la ignoran.
    - `due_date` es una fecha límite opcional en formato `YYYY-MM-DD` (UTC, sin
      hora). `null` o ausente significa "sin fecha límite". Las fechas se
      comparan como cadenas ISO, de modo que `overdue` es `< hoy` y `due_soon`
      está entre `hoy` y `hoy + due_days` (inclusive). Los clientes antiguos
      ignoran el campo.
    - Los estados `due_soon` y `overdue` filtran solo tareas abiertas. El plazo
      de "por vencer" se controla con `due_days` (1–30, default 3) y también
      afecta a los contadores `due_soon`/`overdue`.
    - Las tareas abiertas con fecha límite se ordenan primero por fecha
      ascendente (vencidas primero); las que no tienen fecha conservan el orden
      por tag primario, creación e id.
    - `GET /todos` devuelve JSON; `GET /todos.md` devuelve Markdown.
    - El Markdown de tareas es mutable: el cliente debe re-descargarlo en
      cada refresco; no aplicar la política de "solo si falta el archivo local".
    - Escrituras (`POST/PATCH/DELETE`) requieren API key cuando `API_KEYS`
      está configurado. Si la auth está deshabilitada, devuelven 403 salvo
      `TODO_ALLOW_INSECURE_WRITES=true`.
servers:
  - url: https://hnmd.miguehm.com/v1
    description: Producción (el plugin usa `hnmd_base_url` = esta URL, con /v1)

security:
  - bearerAuth: []

tags:
  - name: status
    description: Estado operativo y disponibilidad del snapshot
  - name: index
    description: Índice de metadatos
  - name: content
    description: Descarga de contenido Markdown
  - name: todos
    description: CRUD y consulta de tareas
  - name: todo-content
    description: Markdown de tareas para KindleHome/KOReader
  - name: todo-index
    description: Índice de tareas compatible con KindleHome

paths:
  /status:
    get:
      tags: [status]
      operationId: getStatus
      summary: Estado operativo del servidor
      description: |
        Indica si hay snapshot listo, versión, auth activa, hora del servidor y
        número de tareas. Protegido por bearer si `API_KEYS` está configurado.
        No devuelve `ETag`; usar `Cache-Control: no-store`.
      responses:
        '200':
          description: Estado obtenido
          headers:
            Cache-Control:
              description: Siempre `no-store`.
              schema: { type: string, example: 'no-store' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                ready:
                  value:
                    schema_version: 1
                    version: 1.5.0
                    auth_enabled: true
                    ready: true
                    snapshot_generated_at: '2026-11-22T14:00:00Z'
                    next_refresh_at: '2026-11-22T14:30:00Z'
                    refresh_interval_seconds: 1800
                    todo_count: 10
                    server_time: '2026-11-22T14:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /top:
    get:
      tags: [index]
      operationId: getTopIndex
      summary: Índice de los ítems top (solo metadatos)
      description: |
        Devuelve como máximo `limit` ítems, ordenados por `rank` ascendente y
        empezando en `offset`. Si la página supera 128 KiB, se recorta la cola
        y `truncated` es `true`; `has_more`/`next_offset` permiten continuar.
        El cliente debería enviar `If-None-Match` con el ETag previo; un `304`
        evita re-descargar el índice. Mantener la respuesta sin cuerpos ni
        comentarios.
      parameters:
        - $ref: '#/components/parameters/OffsetQuery'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
          description: Máximo de ítems a devolver.
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Índice obtenido
          headers:
            ETag:
              description: ETag débil de la respuesta; usar en `If-None-Match`.
              schema: { type: string, example: 'W/"a1b2c3"' }
            Last-Modified:
              description: Informativo.
              schema: { type: string }
            Cache-Control:
              description: 'private, no-cache; revalidar con ETag.'
              schema: { type: string, example: 'private, no-cache' }
            Vary:
              description: 'Accept-Encoding.'
              schema: { type: string, example: 'Accept-Encoding' }
            Content-Encoding:
              description: 'gzip si el cliente lo acepta.'
              schema: { type: string, example: gzip }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnIndexResponse'
              examples:
                ok:
                  value:
                    schema_version: 1
                    generated_at: '2026-11-16T12:00:00Z'
                    next_refresh_at: '2026-11-16T12:30:00Z'
                    refresh_interval_seconds: 1800
                    offset: 0
                    limit: 20
                    returned_count: 2
                    truncated: false
                    has_more: false
                    next_offset: null
                    items:
                      - id: '42123456'
                        rank: 1
                        type: story
                        title: 'A title about something'
                        hn_url: 'https://news.ycombinator.com/item?id=42123456'
                        url: 'https://example.com/post'
                        by: 'alice'
                        score: 231
                        descendants: 87
                        published_at: '2026-11-16T10:12:00Z'
                        domain: 'example.com'
                        content_status: ok
                        content_error: null
                        content_url: '/v1/articles/42123456.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: '42123456-a-title-about-something.md'
                        content_length: 18432
                        updated_at: '2026-11-16T11:58:00Z'
                      - id: '42120001'
                        rank: 2
                        type: ask
                        title: 'Ask HN: How do you do X?'
                        hn_url: 'https://news.ycombinator.com/item?id=42120001'
                        url: null
                        by: 'bob'
                        score: 45
                        descendants: 30
                        published_at: '2026-11-16T09:30:00Z'
                        domain: null
                        content_status: ok
                        content_error: null
                        content_url: '/v1/articles/42120001.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: '42120001-ask-hn-how-do-you-do-x.md'
                        content_length: 9210
                        updated_at: '2026-11-16T11:58:00Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/WarmingUp'
        default:
          $ref: '#/components/responses/Error'

  /articles/{itemId}.md:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/IfNoneMatch'
    get:
      tags: [content]
      operationId: downloadArticleMarkdown
      summary: Descarga el artículo como archivo Markdown
      description: |
        Devuelve el cuerpo del artículo. El cliente pide `Accept: text/markdown`
        y guarda la respuesta en un `.tmp`, validándola con `Content-Length`
        antes de renombrarla atómicamente a su nombre canónico local.

        `404` significa "no hay markdown para este id" (no listo, nunca existió
        o fue purgado en el servidor). El cliente NO borra su copia local en ese
        caso; solo muestra el error si no hay archivo local.

        El `filename` de `Content-Disposition` es una pista; el cliente ignora
        esa ruta y usa su propio nombre `<id>-<slug>.md`.

        El cuerpo debe empezar con una cabecera visible en Markdown
        (`# Título`, línea `> autor · puntos · comentarios · fecha`, enlaces).
        No usar frontmatter YAML: el `.md` puede abrirse en crudo en el lector
        y el frontmatter se vería como texto.
      responses:
        '200':
          description: Contenido Markdown
          headers:
            Content-Type:
              description: Debe ser text/markdown con charset utf-8.
              schema:
                type: string
                example: 'text/markdown; charset=utf-8'
            Content-Length:
              description: |
                Tamaño exacto en bytes. El cliente lo usa para validar que la
                descarga no quedó truncada. Debe ser ≤ 512 KiB.
              schema:
                type: integer
            Content-Disposition:
              description: Pista de nombre de archivo (el cliente puede ignorarla).
              schema:
                type: string
                example: 'inline; filename="42123456-a-title-about-something.md"'
            ETag:
              description: ETag débil; usar en `If-None-Match` para revalidar.
              schema: { type: string, example: 'W/"a1b2c3"' }
            Last-Modified:
              description: Informativo; el cliente puede usar `If-None-Match`.
              schema: { type: string }
            Cache-Control:
              description: 'private, no-cache; revalidar con ETag.'
              schema: { type: string, example: 'private, no-cache' }
            Vary:
              schema: { type: string, example: 'Accept-Encoding' }
            Content-Encoding:
              description: 'gzip si el cliente lo acepta.'
              schema: { type: string, example: gzip }
          content:
            text/markdown:
              schema:
                type: string
                format: binary
              examples:
                article:
                  summary: Cabecera visible + cuerpo
                  value: |
                    # A title about something

                    > alice · 231 points · 87 comments · 2026-11-16
                    > HN: https://news.ycombinator.com/item?id=42123456
                    > URL: https://example.com/post

                    Body in Markdown...
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Sin contenido Markdown para este id. El cliente conserva cualquier
            archivo local existente y solo informa si no hay copia local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: No markdown available for this item
                    item_id: '42123456'
        '503':
          $ref: '#/components/responses/WarmingUp'
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [content]
      operationId: headArticleMarkdown
      summary: Consulta disponibilidad y tamaño sin descargar el cuerpo
      description: |
        Opcional para el cliente (optimización). Mismos códigos que GET.
        Debe devolver `Content-Length` y `Content-Type`, sin cuerpo.
      responses:
        '200':
          description: Disponible
          headers:
            Content-Length:
              schema: { type: integer }
            Content-Type:
              schema: { type: string, example: 'text/markdown; charset=utf-8' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Sin contenido Markdown para este id
        '503':
          $ref: '#/components/responses/WarmingUp'

  /todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: Índice JSON de tareas
      description: |
        Devuelve las tareas filtradas por `tag`, `status` y `tz`, paginadas con
        `offset`/`limit`. `counts` y `tags` son recuentos globales; `items` es
        la página filtrada. Si `truncated` es true sin `has_more`, la página se
        recortó por el límite de 128 KiB; si `has_more`, usa `next_offset`.
      parameters:
        - $ref: '#/components/parameters/TagQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/OffsetQuery'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Máximo de tareas en `items`.
      responses:
        '200':
          description: Índice obtenido
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoIndexResponse'
              examples:
                open:
                  value:
                    schema_version: 1
                    generated_at: '2026-11-22T14:00:00Z'
                    filter:
                      tag: null
                      status: open
                      due_days: 3
                    counts:
                      open: 8
                      done: 2
                      total: 10
                      due_soon: 3
                      overdue: 1
                    tags:
                      - tag: casa
                        open: 3
                        done: 1
                        total: 4
                        due_soon: 2
                        overdue: 1
                      - tag: trabajo
                        open: 2
                        done: 1
                        total: 3
                        due_soon: 1
                        overdue: 0
                    offset: 0
                    limit: 100
                    returned_count: 8
                    truncated: false
                    has_more: false
                    next_offset: null
                    items:
                      - id: a1b2c3d4e5f6a7b8
                        title: Comprar leche
                        tags: [casa, urgente]
                        details: 'Llamar a la tienda antes de las 18:00'
                        due_date: '2026-11-30'
                        done: false
                        created_at: '2026-11-22T13:00:00Z'
                        updated_at: '2026-11-22T13:00:00Z'
                        done_at: null
                        revision: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /todos.md:
    get:
      tags: [todo-content]
      operationId: downloadTodosMarkdown
      summary: Listado Markdown completo
      description: |
        Markdown para KindleHome/KOReader. Es mutable: el cliente debe
        re-descargarlo en cada refresco; no aplicar la política de
        "solo si falta el archivo local" usada para artículos HN.
      parameters:
        - $ref: '#/components/parameters/TagQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
      responses:
        '200':
          $ref: '#/components/responses/TodosMarkdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [todo-content]
      operationId: headTodosMarkdown
      summary: Consulta disponibilidad y tamaño sin descargar el cuerpo
      parameters:
        - $ref: '#/components/parameters/TagQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
      responses:
        '200':
          $ref: '#/components/responses/TodosMarkdownHead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /todos/tags:
    get:
      tags: [todos]
      operationId: listTodoTags
      summary: Tags y contadores globales
      description: |
        Contadores globales paginados. `counts` y `untagged` son globales;
        `tags` es la página solicitada. Usar `offset`/`limit` y `next_offset`
        para recorrer todos los tags.
      parameters:
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/OffsetQuery'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Máximo de tags en `tags`.
      responses:
        '200':
          description: Tags obtenidos
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTagsResponse'
              examples:
                default:
                  value:
                    schema_version: 1
                    generated_at: '2026-11-22T14:00:00Z'
                    counts:
                      open: 8
                      done: 2
                      total: 10
                      due_soon: 3
                      overdue: 1
                    tags:
                      - tag: casa
                        open: 3
                        done: 1
                        total: 4
                        due_soon: 2
                        overdue: 1
                      - tag: trabajo
                        open: 2
                        done: 1
                        total: 3
                        due_soon: 1
                        overdue: 0
                    offset: 0
                    limit: 100
                    returned_count: 2
                    truncated: false
                    has_more: false
                    next_offset: null
                    untagged:
                      open: 3
                      done: 0
                      total: 3
                      due_soon: 0
                      overdue: 0
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /todos/tags/{tag}.md:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    get:
      tags: [todo-content]
      operationId: downloadTodosTagMarkdown
      summary: Markdown filtrado por tag
      description: |
        Lista plana de tareas que contienen el tag. No agrupa por tag primario.
        Si el tag no existe, devuelve 200 con un listado vacío.
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
      responses:
        '200':
          $ref: '#/components/responses/TodosTagMarkdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [todo-content]
      operationId: headTodosTagMarkdown
      summary: Consulta disponibilidad y tamaño sin descargar el cuerpo
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/DueDaysQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
      responses:
        '200':
          $ref: '#/components/responses/TodosTagMarkdownHead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /todos/top:
    get:
      tags: [todo-index]
      operationId: getTodosTopIndex
      summary: Índice de tareas compatible con KindleHome
      description: |
        Mismo esquema que `GET /top`. Los ítems tienen `type: "todo"`.
        Incluye un ítem "Todos"; con `tags=true`, añade un ítem por tag
        con tareas abiertas. `hn_url` es absoluto; `content_url` es relativo
        a `servers[0].url`.
      parameters:
        - $ref: '#/components/parameters/TopTagsQuery'
        - $ref: '#/components/parameters/TimezoneQuery'
      responses:
        '200':
          description: Índice obtenido
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnIndexResponse'
              examples:
                default:
                  value:
                    schema_version: 1
                    generated_at: '2026-11-22T14:00:00Z'
                    next_refresh_at: null
                    refresh_interval_seconds: null
                    returned_count: 2
                    truncated: false
                    items:
                      - id: todos
                        rank: 1
                        type: todo
                        title: 'Todos (8 abiertas)'
                        hn_url: 'https://hnmd.miguehm.com/v1/todos.md'
                        url: null
                        by: null
                        score: null
                        descendants: null
                        published_at: null
                        domain: null
                        content_status: ok
                        content_error: null
                        content_url: '/v1/todos.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: 'todos.md'
                        content_length: 1843
                        updated_at: '2026-11-22T14:00:00Z'
                      - id: todos-tag-casa
                        rank: 2
                        type: todo
                        title: '#casa (3 abiertas)'
                        hn_url: 'https://hnmd.miguehm.com/v1/todos/tags/casa.md'
                        url: null
                        by: null
                        score: null
                        descendants: null
                        published_at: null
                        domain: null
                        content_status: ok
                        content_error: null
                        content_url: '/v1/todos/tags/casa.md'
                        content_type: 'text/markdown; charset=utf-8'
                        suggested_filename: 'todos-casa.md'
                        content_length: 512
                        updated_at: '2026-11-22T14:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

  /todos/tasks:
    post:
      tags: [todos]
      operationId: createTodoTask
      summary: Crear tarea
      description: |
        `text` es el texto introducido, con hashtags opcionales.
        El servidor extrae los hashtags, los normaliza a minúsculas y los
        elimina del título. `tags` añade tags explícitos. Resultado:
        tags parseados + explícitos, sin duplicados, máximo 10.
        `details` es una nota opcional de hasta 1000 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
            examples:
              basic:
                value:
                  text: 'Comprar leche #casa #urgente'
      responses:
        '200':
          description: Ya existía una tarea con el `id` enviado; se devuelve sin cambios
          headers:
            Location:
              description: URL relativa de la tarea existente.
              schema:
                type: string
                example: '/v1/todos/tasks/a1b2c3d4e5f6a7b8'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
        '201':
          description: Tarea creada
          headers:
            Location:
              description: URL relativa de la tarea creada.
              schema:
                type: string
                example: '/v1/todos/tasks/a1b2c3d4e5f6a7b8'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
              examples:
                created:
                  value:
                    id: a1b2c3d4e5f6a7b8
                    title: Comprar leche
                    tags: [casa, urgente]
                    details: 'Llamar a la tienda antes de las 18:00'
                    done: false
                    created_at: '2026-11-22T14:00:00Z'
                    updated_at: '2026-11-22T14:00:00Z'
                    done_at: null
                    revision: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Error'

  /todos/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [todos]
      operationId: getTodoTask
      summary: Obtener tarea
      responses:
        '200':
          description: Tarea obtenida
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
              examples:
                task:
                  value:
                    id: a1b2c3d4e5f6a7b8
                    title: Comprar leche
                    tags: [casa, urgente]
                    details: 'Llamar a la tienda antes de las 18:00'
                    done: false
                    created_at: '2026-11-22T13:00:00Z'
                    updated_at: '2026-11-22T13:00:00Z'
                    done_at: null
                    revision: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [todos]
      operationId: updateTodoTask
      summary: Actualizar tarea
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      description: |
        Al menos un campo. Si `text` está presente, actualiza el título;
        sus hashtags no reemplazan los tags existentes. Si `tags` está
        ausente, los tags actuales se conservan y los hashtags nuevos de
        `text` se fusionan con ellos (normalizados y sin duplicados).
        Si `tags` está presente, reemplaza la lista de tags, incluso con
        un array vacío (`[]`), que borra todos los tags; tiene prioridad
        sobre los hashtags de `text`.
        Si `details` está presente, reemplaza la nota (vacía la borra).
        Si `done` está presente, cambia el estado y `done_at`.

        Requiere `If-Match` con la revisión actual o `*`. Sin cabecera:
        `428 precondition_required`; con revisión obsoleta:
        `412 revision_conflict` con `current_revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
            examples:
              done:
                value:
                  done: true
              rename:
                value:
                  text: 'Comprar leche entera #casa'
      responses:
        '200':
          description: Tarea actualizada
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoTask'
              examples:
                updated:
                  value:
                    id: a1b2c3d4e5f6a7b8
                    title: Comprar leche entera
                    tags: [casa]
                    details: 'Llamar a la tienda antes de las 18:00'
                    done: false
                    created_at: '2026-11-22T13:00:00Z'
                    updated_at: '2026-11-22T15:00:00Z'
                    done_at: null
                    revision: 2
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [todos]
      operationId: deleteTodoTask
      summary: Borrar tarea
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      description: |
        Requiere `If-Match` con la revisión actual o `*`. Devuelve `204` aunque
        la tarea ya no exista. Sin cabecera: `428 precondition_required`; con
        revisión obsoleta: `412 revision_conflict` con `current_revision`.
      responses:
        '204':
          description: Tarea borrada o ya inexistente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <hnmd_api_key> (aplica a /status, /top, /articles/{id}.md y /todos*)'

  parameters:
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: |
        Identificador estable del ítem, exactamente el `id` del índice. No debe
        reutilizarse para contenido distinto: el cliente lo mapea a un archivo
        local permanente.
    OffsetQuery:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Índice inicial basado en cero. Valores negativos o inválidos → 0.
    TimezoneQuery:
      in: query
      name: tz
      required: false
      schema:
        type: string
        example: Europe/Madrid
      description: |
        Zona IANA para calcular `overdue`, `due_soon`, contadores y orden.
        Ausente o vacío usa `TODO_TIMEZONE` (default `UTC`). Inválida → 400
        con `field: tz`.
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
        example: 'W/"a1b2c3"'
      description: ETag previo; si coincide devuelve 304 sin cuerpo.
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        example: '"2"'
      description: |
        Revisión esperada de la tarea: `"N"`, `W/"N"`, lista separada por comas
        o `*`. Obligatoria en PATCH/DELETE.
    TagQuery:
      in: query
      name: tag
      required: false
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      description: Filtra tareas que contienen este tag. Coincidencia exacta.
    StatusQuery:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum: [open, done, all, due_soon, overdue]
        default: open
      description: |
        Estado a incluir. `due_soon` (fecha entre hoy y hoy + `due_days`) y
        `overdue` (fecha anterior a hoy) solo incluyen tareas abiertas. `all`
        incluye todas, abiertas y terminadas.
    DueDaysQuery:
      in: query
      name: due_days
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 30
        default: 3
      description: |
        Horizonte en días para el estado `due_soon` y para los contadores
        `due_soon`. Valores fuera de 1–30 devuelven 400 con `field: due_days`.
    TagPath:
      in: path
      name: tag
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      description: Tag canónico en minúsculas. Debe ir URL-encoded.
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: ID estable de la tarea.
    TopTagsQuery:
      in: query
      name: tags
      required: false
      schema:
        type: boolean
        default: false
      description: Si es true, añade un ítem por tag con tareas abiertas.

  headers:
    ETag:
      description: |
        En `/top`, artículos, `/todos` y `/todos/tags` es débil y sirve para
        `If-None-Match`. En tareas refleja `revision` y debe enviarse como
        `If-Match` en PATCH/DELETE.
      schema:
        type: string
    LastModified:
      description: |
        Fecha de última modificación en formato HTTP. En índices de tareas es
        el timestamp del store; en tareas y artículos, su `updated_at`.
      schema:
        type: string
    CacheControl:
      description: |
        `private, no-cache` en respuestas revalidables (`/top`, artículos,
        `/todos` y `/todos/tags`); `no-store` en contenido mutable (tareas,
        Markdown de tareas, `/status` y errores).
      schema:
        type: string
        example: 'private, no-cache'
    ContentLength:
      description: Tamaño exacto en bytes.
      schema:
        type: integer
    ContentDisposition:
      description: Pista de nombre de archivo.
      schema:
        type: string
        example: 'inline; filename="todos.md"'

  responses:
    Unauthorized:
      description: API key ausente o inválida
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: unauthorized
                message: Invalid or missing API key
    WarmingUp:
      description: Servicio arrancando o temporalmente no disponible
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar (el cliente lo usa en el mensaje). Durante el arranque es fijo, 15 s.
          schema: { type: integer, example: 15 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            warming_up:
              value:
                error: warming_up
                message: Server is warming up, try again later
                retry_after_seconds: 15
    NotModified:
      description: Sin cambios; el cliente conserva su copia local.
      headers:
        ETag:
          description: Mismo ETag débil que la representación actual.
          schema: { type: string }
        Last-Modified:
          description: Última modificación del recurso en formato HTTP.
          schema: { type: string }
        Cache-Control:
          schema: { type: string, example: 'private, no-cache' }
        Vary:
          description: Cabeceras que afectan a la representación.
          schema: { type: string, example: 'Origin, Accept-Encoding' }
    PreconditionRequired:
      description: Falta `If-Match` en una escritura de tarea.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            required:
              value:
                error: precondition_required
                message: If-Match header is required for task writes
                field: if_match
    RevisionConflict:
      description: La revisión enviada no coincide con la actual.
      headers:
        ETag:
          description: ETag fuerte de la revisión actual.
          schema: { type: string, example: '"3"' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error: revision_conflict
                message: task revision does not match
                current_revision: 3
    Error:
      description: Error genérico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Escrituras deshabilitadas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error: forbidden
                message: Writes require API_KEYS or TODO_ALLOW_INSECURE_WRITES=true
    InvalidRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                error: invalid_request
                message: text is required
                field: text
    NotFound:
      description: Tarea no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                error: not_found
                message: Task not found
                task_id: a1b2c3d4e5f6a7b8
    PayloadTooLarge:
      description: Cuerpo demasiado grande
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            too_large:
              value:
                error: payload_too_large
                message: Request body exceeds 64 KiB
    TodosMarkdown:
      description: Markdown generado
      headers:
        Content-Type:
          description: Debe ser text/markdown con charset utf-8.
          schema:
            type: string
            example: 'text/markdown; charset=utf-8'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/markdown:
          schema:
            type: string
            format: binary
          examples:
            default:
              summary: Listado completo (status=all)
              value: |
                # Todos

                > 8 abiertas · 2 hechas · 2026-11-22 14:00

                ## #casa
                - [ ] Comprar leche #urgente
                  Llamar a la tienda antes de las 18:00
                - [ ] Pagar alquiler (vence 2026-11-30)

                ## #trabajo
                - [ ] Enviar informe #urgente

                ## Sin etiqueta
                - [ ] Llamar al médico

                ## Hechas
                - [x] Revisar correo #trabajo
    TodosTagMarkdown:
      description: Markdown filtrado por tag
      headers:
        Content-Type:
          description: Debe ser text/markdown con charset utf-8.
          schema:
            type: string
            example: 'text/markdown; charset=utf-8'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Disposition:
          description: Pista de nombre de archivo para la vista por tag.
          schema:
            type: string
            example: 'inline; filename="todos-casa.md"'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/markdown:
          schema:
            type: string
            format: binary
          examples:
            default:
              summary: Listado filtrado
              value: |
                # Todos — #casa

                > 3 abiertas · 1 hecha · 2026-11-22 14:00

                - [ ] Comprar leche #urgente
                  Llamar a la tienda antes de las 18:00
                - [ ] Pagar alquiler
    TodosMarkdownHead:
      description: Disponible
      headers:
        Content-Type:
          schema:
            type: string
            example: 'text/markdown; charset=utf-8'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    TodosTagMarkdownHead:
      description: Disponible
      headers:
        Content-Type:
          schema:
            type: string
            example: 'text/markdown; charset=utf-8'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Disposition:
          description: Pista de nombre de archivo para la vista por tag.
          schema:
            type: string
            example: 'inline; filename="todos-casa.md"'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'

  schemas:
    StatusResponse:
      type: object
      required: [schema_version, version, auth_enabled, ready, todo_count, server_time]
      properties:
        schema_version:
          type: integer
          example: 1
        version:
          type: string
          example: 1.5.0
        auth_enabled:
          type: boolean
          example: true
        ready:
          type: boolean
          description: true cuando existe un snapshot HN listo.
        snapshot_generated_at:
          type: string
          format: date-time
          nullable: true
        next_refresh_at:
          type: string
          format: date-time
          nullable: true
        refresh_interval_seconds:
          type: integer
          nullable: true
        last_refresh_error:
          type: string
          description: |
            Código estable del último refresco fallido desde el último exitoso
            (`hn_unavailable`, `refresh_timeout`). Se omite si no hay error. Puede
            aparecer con `ready: false` cuando falla el arranque.
        last_refresh_error_at:
          type: string
          format: date-time
          description: Momento del último refresco fallido. Se omite si no hay error.
        todo_count:
          type: integer
          minimum: 0
        server_time:
          type: string
          format: date-time

    HnIndexResponse:
      type: object
      required: [schema_version, generated_at, returned_count, truncated, items]
      properties:
        schema_version:
          type: integer
          example: 1
          description: Versión del contrato; el cliente rechaza versiones que no conoce.
        generated_at:
          type: string
          format: date-time
        next_refresh_at:
          type: string
          format: date-time
          nullable: true
        refresh_interval_seconds:
          type: integer
          nullable: true
        offset:
          type: integer
          minimum: 0
          description: Presente en `/top`; ausente en `/todos/top`.
        limit:
          type: integer
          minimum: 1
          maximum: 30
          description: Presente en `/top`; ausente en `/todos/top`.
        has_more:
          type: boolean
          description: Presente en `/top`; ausente en `/todos/top`.
        next_offset:
          type: integer
          nullable: true
          description: Siguiente `offset` cuando `has_more` es true.
        returned_count:
          type: integer
          description: Número de ítems en `items` (no el total disponible).
          example: 20
        truncated:
          type: boolean
          description: true si había más ítems que `limit` y se recortó la cola.
        items:
          type: array
          items:
            $ref: '#/components/schemas/HnIndexItem'

    HnIndexItem:
      type: object
      required: [id, rank, title, hn_url, content_status]
      properties:
        id:
          type: string
          description: |
            Identificador estable del ítem. En /top coincide con `{itemId}`;
            en /todos/top es `todos` o `todos-tag-<tag>`.
          example: '42123456'
        rank:
          type: integer
          minimum: 1
        type:
          type: string
          example: story
          description: 'Tipo del ítem. En /top: story, ask, job, poll, ... En /todos/top: todo. No es un enum cerrado.'
        title:
          type: string
        hn_url:
          type: string
          format: uri
          description: |
            En /top es la URL del ítem en Hacker News; en /todos/top es la
            URL absoluta del Markdown correspondiente.
        url:
          type: string
          format: uri
          nullable: true
          description: URL externa; null en Ask HN / posts de texto.
        by:
          type: string
          nullable: true
        score:
          type: integer
          nullable: true
        descendants:
          type: integer
          nullable: true
          description: Número de comentarios.
        published_at:
          type: string
          format: date-time
          nullable: true
        domain:
          type: string
          nullable: true
        content_status:
          type: string
          enum: [ok, no_content, warming_up, error]
          description: |
            Única fuente de verdad sobre la descarga:
            - ok: GET /articles/{id}.md puede devolver 200 → descargar si falta local.
            - no_content: no habrá markdown → el cliente no intenta descargar.
            - warming_up: aún no listo → el cliente no intenta descargar ahora.
            - error: fallo de generación/captura → el cliente no intenta descargar.
        content_error:
          type: string
          nullable: true
          description: |
            Código estable cuando content_status != ok (para el log/UX). Nunca
            incluye direcciones ni detalles internos. Valores: fetch_failed,
            fetch_timeout, fetch_blocked, unsupported_scheme, too_many_redirects,
            unsupported_content_type, body_too_large, upstream_status_<código>,
            extract_failed, convert_failed, too_large, hn_unavailable,
            item_unavailable. Los clientes deben tolerar valores nuevos.
        content_url:
          type: string
          nullable: true
          description: |
            Ruta relativa a `servers[0].url` (ej. `/v1/articles/42123456.md`).
            El cliente rechaza URLs absolutas, otros hosts y esquemas != https.
        content_type:
          type: string
          nullable: true
          example: 'text/markdown; charset=utf-8'
        suggested_filename:
          type: string
          nullable: true
          example: '42123456-a-title-about-something.md'
        content_length:
          type: integer
          nullable: true
          description: Tamaño exacto en bytes si se conoce; permite descartar > 512 KiB sin descargar.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Informativo; el cliente no invalida archivos locales.

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - unauthorized
            - forbidden
            - warming_up
            - invalid_request
            - not_found
            - method_not_allowed
            - payload_too_large
            - precondition_required
            - revision_conflict
            - internal_error
        message:
          type: string
          description: Mensaje corto y accionable (se muestra en la UI del plugin).
        field:
          type: string
          nullable: true
          description: Campo inválido cuando `error=invalid_request`.
        item_id:
          type: string
          nullable: true
        task_id:
          type: string
          nullable: true
        retry_after_seconds:
          type: integer
          nullable: true
        current_revision:
          type: integer
          nullable: true
          description: Revisión actual cuando `error=revision_conflict`.

    TodoTask:
      type: object
      required: [id, title, tags, done, created_at, updated_at, revision]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: a1b2c3d4e5f6a7b8
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Comprar leche
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Tags canónicos en minúsculas. El primer elemento es el tag
            primario y se usa para agrupar en Markdown. Puede estar vacío.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
            example: casa
        details:
          type: string
          maxLength: 1000
          description: |
            Nota opcional de la tarea. Se preservan los saltos de línea y se
            renderiza como líneas indentadas bajo la tarea en el Markdown.
            Ausente o vacía en tareas creadas antes de este campo.
          example: 'Llamar a la tienda antes de las 18:00'
        due_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: |
            Fecha límite opcional en `YYYY-MM-DD` (UTC, sin hora). `null` o
            ausente significa que la tarea no tiene fecha límite. Se renderiza
            como `(vence YYYY-MM-DD)` en el Markdown. Las tareas abiertas con
            fecha se ordenan primero por fecha ascendente. Ausente en tareas
            creadas antes de la versión 1.4.0.
          example: '2026-11-30'
        done:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        done_at:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          minimum: 1
          description: Incrementa en cada modificación.

    TodoCounts:
      type: object
      required: [open, done, total, due_soon, overdue]
      properties:
        open:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        due_soon:
          type: integer
          minimum: 0
          description: |
            Tareas abiertas con fecha entre hoy y hoy + `due_days` (inclusive).
            No incluye las vencidas.
        overdue:
          type: integer
          minimum: 0
          description: Tareas abiertas con fecha anterior a hoy.

    TodoTagCount:
      type: object
      required: [tag, open, done, total, due_soon, overdue]
      properties:
        tag:
          type: string
          example: casa
        open:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        due_soon:
          type: integer
          minimum: 0
          description: Abiertas con este tag que vencen en el plazo configurado.
        overdue:
          type: integer
          minimum: 0
          description: Abiertas con este tag cuya fecha es anterior a hoy.

    TodoIndexResponse:
      type: object
      required:
        - schema_version
        - generated_at
        - filter
        - counts
        - tags
        - offset
        - limit
        - returned_count
        - truncated
        - has_more
        - items
      properties:
        schema_version:
          type: integer
          example: 1
        generated_at:
          type: string
          format: date-time
          description: Última modificación del store de tareas (UTC); estable entre escrituras.
        filter:
          type: object
          required: [status]
          properties:
            tag:
              type: string
              nullable: true
            status:
              type: string
              enum: [open, done, all, due_soon, overdue]
            due_days:
              type: integer
              minimum: 1
              maximum: 30
              description: Horizonte efectivo usado para el estado y los contadores `due_soon`.
        counts:
          allOf:
            - $ref: '#/components/schemas/TodoCounts'
          description: Recuentos globales, no filtrados.
        tags:
          type: array
          description: Recuentos globales por tag, orden alfabético.
          items:
            $ref: '#/components/schemas/TodoTagCount'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 500
        returned_count:
          type: integer
          description: Número de tareas en `items`.
        truncated:
          type: boolean
          description: true si se recortó por `has_more` o por el límite de 128 KiB.
        has_more:
          type: boolean
        next_offset:
          type: integer
          nullable: true
          description: Siguiente `offset` cuando `has_more` es true.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoTask'

    TodoTagsResponse:
      type: object
      required:
        - schema_version
        - generated_at
        - counts
        - tags
        - untagged
        - offset
        - limit
        - returned_count
        - truncated
        - has_more
      properties:
        schema_version:
          type: integer
          example: 1
        generated_at:
          type: string
          format: date-time
          description: Última modificación del store de tareas (UTC); estable entre escrituras.
        counts:
          allOf:
            - $ref: '#/components/schemas/TodoCounts'
          description: Recuentos globales.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TodoTagCount'
        untagged:
          allOf:
            - $ref: '#/components/schemas/TodoCounts'
          description: Tareas sin tags.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 500
        returned_count:
          type: integer
          description: Número de tags en `tags`.
        truncated:
          type: boolean
          description: true si se recortó por `has_more` o por el límite de 128 KiB.
        has_more:
          type: boolean
        next_offset:
          type: integer
          nullable: true
          description: Siguiente `offset` cuando `has_more` es true.

    CreateTodoRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: |
            ID opcional para creación idempotente. Si ya existe una tarea con
            ese ID, se devuelve `200` con la tarea existente; en caso contrario
            `201`. Ausente o vacío genera un ID nuevo.
          example: a1b2c3d4e5f6a7b8
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            Texto de la tarea. Los hashtags se extraen, se normalizan a
            minúsculas y se eliminan del título.
          example: 'Comprar leche #casa #urgente'
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Tags adicionales; se unen a los parseados de `text`.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        details:
          type: string
          maxLength: 1000
          description: Nota opcional; los saltos de línea se preservan.
          example: 'Llamar a la tienda antes de las 18:00'
        due_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: |
            Fecha límite opcional en `YYYY-MM-DD`. `null` o ausente = sin fecha
            límite. Una fecha inválida devuelve 400 con `field: due_date`.
          example: '2026-11-30'
        done:
          type: boolean
          default: false

    UpdateTodoRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            Si está presente, actualiza el título. Nunca borra los tags por sí
            solo: si `tags` está ausente, los hashtags del texto se fusionan
            con los tags existentes (normalizados y sin duplicados) y, si el
            texto no tiene hashtags, los tags se conservan tal cual.
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Si está presente, reemplaza la lista de tags, incluso con `[]`
            (que borra todos los tags). Tiene prioridad sobre los hashtags de
            `text`. Si está ausente, se conservan los tags existentes y se
            fusionan los hashtags nuevos de `text`.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        details:
          type: string
          maxLength: 1000
          description: Si está presente, reemplaza la nota (cadena vacía la borra).
        due_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: |
            Si está presente, reemplaza la fecha límite. `null` o `""` la borra.
            Una fecha inválida devuelve 400 con `field: due_date`.
          example: '2026-11-30'
        done:
          type: boolean
          description: Cambia el estado y actualiza `done_at`.
